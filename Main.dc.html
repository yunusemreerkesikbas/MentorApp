<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
    a { color: #6d28d9; } a:hover { color: #5b21b6; }
  </style>
</helmet>

<div style="position: relative; width: 448px; height: 600px; border-radius: 24px; overflow: hidden; background: #faf7f3; display: flex; flex-direction: column;">

  <div style="position: absolute; left: -70px; top: -70px; width: 240px; height: 240px; border-radius: 999px; background: #bea1fe; opacity: .16; pointer-events: none;"></div>

  <div style="position: absolute; right: 12px; top: 12px; z-index: 3; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; background: rgba(17,17,17,.06);">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.25" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </div>

  <div style="position: relative; z-index: 1; display: flex; flex-direction: column; padding: 56px 32px 0;">

    <div style="display: flex; align-items: center; gap: 10px;">
      <img src="gift-premium.svg" alt="" style="width: 40px; height: 40px; object-fit: contain;">
      <p style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #666666;">Sana özel</p>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 12px; margin-top: 18px;">
      <p style="margin: 0; font-size: 116px; font-weight: 800; line-height: .82; letter-spacing: -.05em; color: #111111;">%20</p>
      <p style="margin: 14px 0 0; font-size: 15px; font-weight: 700; line-height: 1.2; letter-spacing: .02em; color: #111111; writing-mode: vertical-rl;">İNDİRİM</p>
    </div>

    <h2 style="margin: 22px 0 0; font-size: 28px; font-weight: 800; line-height: 1.2; letter-spacing: -.01em; color: #111111;">Hoş geldin hediyen</h2>

    <div style="display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; max-width: 24rem;">
      <span style="flex-shrink: 0; margin-top: 2px; color: #2e7d54;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>
      </span>
      <p style="margin: 0; font-size: 15px; font-weight: 500; line-height: 1.5; color: #333333;"><strong style="font-weight: 700; color: #111111;">Tüm planlarda geçerli.</strong> Planını ödeme ekranında seçersin.</p>
    </div>

    <div style="position: relative; display: flex; align-items: stretch; min-height: 76px; margin-top: 24px; border-radius: 14px; background: #ffffff; outline: 1.5px solid #111111; outline-offset: -1.5px; -webkit-mask-image: radial-gradient(circle 9px at 0 50%, transparent 9px, #000 9.5px), radial-gradient(circle 9px at 100% 50%, transparent 9px, #000 9.5px); mask-image: radial-gradient(circle 9px at 0 50%, transparent 9px, #000 9.5px), radial-gradient(circle 9px at 100% 50%, transparent 9px, #000 9.5px); -webkit-mask-composite: source-in; mask-composite: intersect;">
      <div style="display: flex; flex-direction: column; justify-content: center; flex: 1 1 0; min-width: 0; padding: 12px 12px 12px 24px;">
        <p style="margin: 0; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #666666;">Kupon kodun</p>
        <p style="margin: 3px 0 0; font-size: 20px; font-weight: 800; letter-spacing: .1em; color: #111111;">HOSGELDIN</p>
      </div>
      <div style="width: 1px; flex-shrink: 0; margin: 12px 0; border-left: 1.5px dashed rgba(17,17,17,.25);"></div>
      <div style="display: flex; align-items: center; flex-shrink: 0; padding: 10px 16px 10px 12px;">
        <span style="display: flex; align-items: center; gap: 7px; border-radius: 999px; background: #111111; color: #ffffff; padding: 10px 16px; font-size: 13px; font-weight: 700;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Kopyala
        </span>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="position: relative; z-index: 1; display: flex; flex-direction: column; gap: 8px; padding: 20px 32px 24px;">
    <button style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px; border: 0; border-radius: 10px; background: #000000; color: #ffffff; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>
      Uygula ve devam et
    </button>
    <button style="width: 100%; min-height: 44px; border: 0; background: transparent; color: #666666; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">Sonra bakarım</button>
  </div>
</div>
</x-dc>
</body>
</html>
