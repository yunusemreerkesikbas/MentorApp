<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
    a { color: #6d28d9; } a:hover { color: #5b21b6; }
    @keyframes twinkle {
      0%, 100% { opacity: .35; transform: scale(.82) rotate(-6deg); }
      50%      { opacity: 1;   transform: scale(1.12) rotate(10deg); }
    }
  </style>
</helmet>

<div style="position: relative; width: 448px; height: 640px; border-radius: 24px; overflow: hidden; background: linear-gradient(165deg, #6d28d9 0%, #713dc6 42%, #3b0764 100%); display: flex; flex-direction: column;">

  <div style="position: absolute; inset: 0; opacity: .35; background-image: radial-gradient(circle, rgba(255,255,255,0.7) 0 1.25px, transparent 1.6px); background-size: 26px 26px; background-position: 10px 12px; pointer-events: none;"></div>
  <div style="position: absolute; left: 50%; top: 0; width: 120%; height: 42%; transform: translateX(-50%); opacity: .4; background: radial-gradient(ellipse 55% 70% at 50% 0%, rgba(255,255,255,0.35) 0%, transparent 70%); pointer-events: none;"></div>

  <div style="position: absolute; right: 12px; top: 12px; z-index: 3; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; background: #ffffff; box-shadow: 0px 4px 10px rgba(37,73,150,0.18);">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.25" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </div>

  <div style="position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; padding: 56px 24px 0;">

    <div style="position: relative; width: 96px; height: 96px;">
      <span style="position: absolute; left: -6px; top: 8px; color: rgba(255,255,255,.92); animation: twinkle 2.4s ease-in-out infinite;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5 13.8 9.2 21.5 11 13.8 12.8 12 20.5 10.2 12.8 2.5 11 10.2 9.2 12 1.5Z"/></svg>
      </span>
      <span style="position: absolute; right: -8px; top: 30px; color: rgba(255,255,255,.92); animation: twinkle 2.4s ease-in-out .55s infinite;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5 13.8 9.2 21.5 11 13.8 12.8 12 20.5 10.2 12.8 2.5 11 10.2 9.2 12 1.5Z"/></svg>
      </span>
      <img src="gift-premium.svg" alt="" style="width: 96px; height: 96px; object-fit: contain; filter: drop-shadow(0 12px 28px rgba(20,5,40,0.4));">
    </div>

    <p style="margin: 14px 0 0; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #ffffff;">Sana özel</p>

    <h2 style="margin: 8px 0 0; font-size: 32px; font-weight: 800; line-height: 1.15; text-align: center; text-wrap: balance; color: #ffffff;">Hoş geldin hediyen</h2>

    <p style="margin: 10px 0 0; max-width: 21rem; font-size: 15px; font-weight: 500; line-height: 1.5; text-align: center; color: rgba(255,255,255,.9);">İlk ödemende geçerli. İstediğin an iptal edebilirsin.</p>

    <div style="position: relative; margin-top: 22px; width: 100%; display: flex; align-items: stretch; min-height: 104px; border-radius: 18px; background: rgba(0,0,0,.28); box-shadow: 0 8px 24px rgba(20,5,40,.35); outline: 1px solid rgba(255,255,255,.2); outline-offset: -1px; backdrop-filter: blur(12px); -webkit-mask-image: radial-gradient(circle 10px at 0 50%, transparent 10px, #000 10.5px), radial-gradient(circle 10px at 100% 50%, transparent 10px, #000 10.5px); mask-image: radial-gradient(circle 10px at 0 50%, transparent 10px, #000 10.5px), radial-gradient(circle 10px at 100% 50%, transparent 10px, #000 10.5px); -webkit-mask-composite: source-in; mask-composite: intersect;">

      <div style="display: flex; flex-direction: column; justify-content: center; flex: 1 1 0; min-width: 0; padding: 16px 12px 16px 26px; text-align: left;">
        <p style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.65);">Kupon kodun</p>
        <p style="margin: 4px 0 0; font-size: 22px; font-weight: 800; letter-spacing: .06em; color: #ffffff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">HOSGELDIN</p>
        <div style="display: flex; align-items: center; gap: 6px; margin-top: 8px; color: rgba(255,255,255,.72);">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span style="font-size: 12px; font-weight: 600;">Kopyala</span>
        </div>
      </div>

      <div style="width: 1px; flex-shrink: 0; margin: 16px 0; border-left: 1px dashed rgba(255,255,255,.4);"></div>

      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; width: 124px; padding: 12px;">
        <p style="margin: 0; font-size: 46px; font-weight: 800; line-height: 1; letter-spacing: -.02em; color: #ffffff;">%20</p>
        <p style="margin: 4px 0 0; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.72);">indirim</p>
      </div>
    </div>

    <div style="display: flex; align-items: baseline; justify-content: center; gap: 8px; margin-top: 16px;">
      <span style="font-size: 15px; font-weight: 600; color: rgba(255,255,255,.6); text-decoration: line-through;">₺249,00</span>
      <span style="font-size: 20px; font-weight: 800; color: #ffffff;">₺199,20</span>
      <span style="font-size: 13px; font-weight: 600; color: rgba(255,255,255,.72);">/ay</span>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="position: relative; z-index: 1; display: flex; flex-direction: column; gap: 10px; border-top-left-radius: 24px; border-top-right-radius: 24px; background: #ffffff; padding: 20px;">
    <button style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px; border: 0; border-radius: 10px; background: #000000; color: #ffffff; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0px 4px 10px rgba(37,73,150,0.1);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>
      Uygula ve devam et
    </button>
    <button style="width: 100%; min-height: 44px; border: 0; background: transparent; color: #666666; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">Sonra bakarım</button>
  </div>
</div>
</x-dc>
</body>
</html>
