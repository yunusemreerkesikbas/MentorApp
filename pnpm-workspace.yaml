packages:
  - "apps/*"
  - "packages/*"
overrides:
  body-parser: 2.3.0
  browserslist: 4.28.9
  form-data: 4.0.6
  immutable: 5.1.9
  js-yaml: 4.3.2
  multer: 2.3.0
  nanoid@3: 3.3.18
  postcss: 8.5.28
  proxy-addr: 2.0.8
  qs: 6.16.0
  sharp: 0.35.5
  source-map-js: 1.2.2
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack-exhaustion DoS. No patched 3.0.4 is published on npm yet.
    # Only reached via nestjs-i18n > chokidar, which watches files in local development only
    # (apps/api/src/i18n/i18n.module.ts). Remove once braces 3.0.4 ships.
    - GHSA-vfj7-8cjw-p6xm
allowBuilds:
  "@nestjs/core": true
  '@parcel/watcher': true
  "@scarf/scarf": false
  "@swc/core": true
  argon2: true
  # core-js postinstall is only a funding message — no functional build needed (admin/Duralux dep).
  core-js: false
  esbuild: true
  sharp: true
  unrs-resolver: true
