packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@nestjs/core": true
  '@parcel/watcher': true
  "@scarf/scarf": false
  "@swc/core": true
  argon2: true
  # core-js postinstall is only a funding message — no functional build needed (admin/Duralux dep).
  core-js: false
  esbuild: true
  sharp: true
  unrs-resolver: true
