packages:
  - "apps/*"
  - "packages/*"
overrides:
  body-parser: 2.3.0
  browserslist: 4.28.9
  form-data: 4.0.6
  immutable: 5.1.9
  js-yaml: 4.3.2
  multer: 2.3.0
  nanoid@3: 3.3.18
  postcss: 8.5.28
  qs: 6.16.0
allowBuilds:
  "@nestjs/core": true
  '@parcel/watcher': true
  "@scarf/scarf": false
  "@swc/core": true
  argon2: true
  # core-js postinstall is only a funding message — no functional build needed (admin/Duralux dep).
  core-js: false
  esbuild: true
  sharp: true
  unrs-resolver: true
