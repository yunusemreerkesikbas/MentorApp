name: CI

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master]

jobs:
  build:
    name: lint · typecheck · build · test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mentor
          POSTGRES_PASSWORD: mentor
          POSTGRES_DB: mentor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mentor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # e2e tests connect here (the `mentor` db is enough — they only need a reachable DB).
      TEST_DATABASE_URL: postgres://mentor:mentor@localhost:5432/mentor

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm --filter @mentor/web exec playwright install --with-deps chromium

      - name: Analiz browser smoke
        run: pnpm --filter @mentor/web test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analiz-playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
