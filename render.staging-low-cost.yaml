# Proposed on-demand staging. Choose this OR render.staging.yaml, never both.
# Free web services sleep on idle. Apply migrations manually before each deploy.
services:
  - type: web
    name: mentor-s1-api
    branch: master
    runtime: node
    region: frankfurt
    plan: free
    autoDeployTrigger: off
    domains: [s1-api.puhukoc.com]
    renderSubdomainPolicy: enabled
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm exec turbo run build --filter=@mentor/api
    startCommand: pnpm --filter @mentor/api start:prod
    healthCheckPath: /v1/health/ready
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      # APP_ENV is the deployment name; NODE_ENV stays production on stage too.
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_MIGRATION_URL
        sync: false
      - key: APP_URL
        value: https://s1.puhukoc.com
      - key: ADMIN_APP_URL
        value: https://s1-admin.puhukoc.com
      - key: EDGE_ORIGIN_SECRET
        sync: false
      - key: AUTH_RATE_LIMIT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://s1.puhukoc.com,https://s1-admin.puhukoc.com
      - key: CLOUDFLARE_ACCESS_TEAM_DOMAIN
        sync: false
      - key: CLOUDFLARE_ACCESS_AUD
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: VISION_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BUCKET
        value: puhu-s1-public
      - key: R2_PRIVATE_BUCKET
        value: puhu-s1-private
      - key: R2_PUBLIC_BASE_URL
        value: https://s1-media.puhukoc.com
      - key: R2_JURISDICTION
        value: eu
      - key: PAYMENTS_PROVIDER
        value: disabled
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TURNSTILE_EXPECTED_HOSTNAME
        value: s1.puhukoc.com
      - key: TURNSTILE_EXPECTED_ACTION
        value: signup
      - key: TURNSTILE_VERIFY_TIMEOUT_MS
        value: 5000
      - key: POSTMARK_TOKEN
        sync: false
      - key: POSTMARK_FROM
        value: noreply@puhukoc.com
      - key: CRON_SECRET
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: https://s1.puhukoc.com
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: mentor-s1-web
    branch: master
    runtime: node
    region: frankfurt
    plan: free
    autoDeployTrigger: off
    domains: [s1.puhukoc.com]
    renderSubdomainPolicy: disabled
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm exec turbo run build --filter=@mentor/web
    startCommand: pnpm --filter @mentor/web start:prod
    healthCheckPath: /tr
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: NEXT_PUBLIC_API_URL
        value: https://s1-api.puhukoc.com/v1
      - key: WEB_CSP_STORAGE_ORIGINS
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        value: https://s1.puhukoc.com
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: NEXT_PUBLIC_GA_MEASUREMENT_ID
        sync: false
      - key: GOOGLE_ADS_PUBLISHER_ID
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
